<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo repository</title>
  </head>
  <body>
    <h1>Welcome to the website generated by my demo repository</h1>

    <section aria-labelledby="newsletter-title">
      <h2 id="newsletter-title">Get the newsletter</h2>
      <p>One email a month about what's new. We'll ask you to confirm your address first.</p>
      <form id="newsletter-form">
        <label for="newsletter-email">Email</label>
        <input id="newsletter-email" name="email" type="email" autocomplete="email" required>
        <button type="submit">Subscribe</button>
      </form>
      <p id="newsletter-status" role="status"></p>
    </section>

    <script type="module" src="dist/signup/form.js"></script>
  </body>
</html>
